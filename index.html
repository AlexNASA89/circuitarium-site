<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuitarium — how chips work</title>
<meta name="description" content="Circuitarium: short 3D videos that show how a computer chip works, from one transistor to a working calculator. Watch the course in order, in English or Russian.">
<meta property="og:title" content="Circuitarium">
<meta property="og:description" content="How a chip works, one switch at a time. A short 3D video course, in order.">
<meta property="og:image" content="https://circuitarium.com/img/covers/0-1.jpg">
<meta name="theme-color" content="#0b0e15">
<link rel="icon" type="image/png" href="brand/icon_64.png">
<style>
  :root {
    --bg:#0b0e15; --panel:#121724; --panel2:#19202f; --line:#222a3b; --line2:#313b52;
    --ink:#eef1f6; --dim:#99a3b5; --mute:#5f6a80;
    --red:#ff5d52; --blue:#4a7dff;
    --bar:56px; --r:16px;
    --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:3px; border-radius:6px; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }

  /* ── top bar ── */
  .bar { position:sticky; top:0; z-index:30; background:rgba(11,14,21,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .bar .wrap { display:flex; align-items:center; gap:10px; height:var(--bar); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.08em; font-size:15px; }
  .brand img { width:28px; height:auto; display:block; }
  .lang { margin-left:auto; display:flex; padding:3px; border-radius:999px; background:var(--panel); border:1px solid var(--line); }
  .lang button { min-width:44px; height:32px; padding:0 12px; border:0; border-radius:999px; background:transparent; color:var(--dim); font-size:13px; font-weight:800; letter-spacing:.06em; cursor:pointer; }
  .lang button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }

  /* ── hero ── */
  .hero { position:relative; padding:36px 0 30px; display:grid; gap:26px; align-items:center; }
  h1 { font-size:clamp(34px,8.6vw,64px); line-height:1.02; letter-spacing:-.025em; font-weight:800; margin-top:12px; text-wrap:balance; }
  h1 em { font-style:normal; color:var(--red); }
  .lead { color:var(--dim); font-size:17px; line-height:1.55; margin-top:16px; max-width:33em; }
  .cta { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:9px; height:48px; padding:0 22px; border-radius:999px; border:1px solid var(--line2); background:var(--panel); font-weight:700; font-size:15px; cursor:pointer; white-space:nowrap; transition:border-color .2s, background .2s, transform .2s; }
  .btn:hover { border-color:#4a5672; }
  .btn:active { transform:scale(.98); }
  .btn.main { background:var(--red); border-color:var(--red); color:#14080a; }
  .btn.main:hover { background:#ff7167; border-color:#ff7167; }
  .btn svg { width:18px; height:18px; flex:none; }

  /* hero figure: the transistor mark, switching */
  .switch { justify-self:center; width:min(52vw,210px); position:relative; }
  .switch svg { width:100%; height:auto; display:block; overflow:visible; }
  .switch::before { content:""; position:absolute; inset:18% -22% -28%; background:radial-gradient(closest-side, rgba(74,125,255,.26), transparent 72%); z-index:-1; }
  .sw-gate, .sw-ring { animation:gate 4.4s ease-in-out infinite; }
  .sw-flow { animation:flow 4.4s ease-in-out infinite; }
  .sw-dot { animation:run 1.1s linear infinite; }
  .sw-bit::after { content:"1"; animation:bit 4.4s steps(1) infinite; }
  .sw-cap { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:14px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .sw-bit { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:7px; border:1px solid var(--line2); color:var(--ink); font-weight:900; font-size:14px; letter-spacing:0; }
  @keyframes gate { 0%,12%,62%,100% { fill:#eef1f6; stroke:#eef1f6; filter:none; } 20%,54% { fill:#fff; stroke:#fff; filter:drop-shadow(0 0 14px rgba(255,255,255,.75)); } }
  @keyframes flow { 0%,16%,58%,100% { opacity:0; } 24%,50% { opacity:1; } }
  @keyframes run { to { transform:translateX(23px); } }
  @keyframes bit { 0%,58% { content:"1"; } 16% { content:"1"; } 0%,15.9% { content:"0"; } 16%,57.9% { content:"1"; } 58%,100% { content:"0"; } }

  /* ── season map (the 0..7 cells from the covers) ── */
  .map { position:sticky; top:var(--bar); z-index:20; background:rgba(11,14,21,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:10px 0 12px; }
  .map-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; }
  .map-head b { font-size:12px; font-weight:700; color:var(--mute); letter-spacing:.04em; white-space:nowrap; }
  .cells { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
  .cell { position:relative; display:grid; place-items:center; height:40px; border-radius:10px; border:1.5px solid var(--line2); background:var(--panel); color:var(--mute); font-weight:900; font-size:17px; transition:border-color .2s, color .2s, background .2s; }
  .cell.has { color:var(--ink); border-color:#55607a; }
  .cell.on { background:var(--red); border-color:var(--red); color:#14080a; }
  .cell i { display:none; }

  /* ── episodes ── */
  .ep { padding:40px 0 4px; scroll-margin-top:calc(var(--bar) + 92px); }
  .ep-head { display:grid; grid-template-columns:auto 1fr; column-gap:16px; align-items:center; margin-bottom:18px; }
  .ep-num { grid-row:span 2; font-size:64px; line-height:.9; font-weight:900; letter-spacing:-.04em; color:var(--red); min-width:.62em; }
  .ep.later .ep-num { color:#2c3549; }
  .ep-head h2 { font-size:25px; line-height:1.15; letter-spacing:-.015em; font-weight:800; }
  .ep.later h2 { color:var(--dim); }
  .ep-sub { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:7px; color:var(--dim); font-size:13.5px; font-weight:600; }
  .pips { display:flex; gap:4px; }
  .pips i { width:20px; height:6px; border-radius:3px; background:#2a3347; }
  .pips i.lit { background:var(--red); }

  .parts { display:grid; gap:12px; }
  .part { position:relative; display:grid; grid-template-columns:100px 1fr; gap:12px; padding:10px; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); }
  .cover { position:relative; display:block; width:100%; aspect-ratio:9/16; border-radius:10px; overflow:hidden; background:var(--panel2); border:0; padding:0; cursor:pointer; }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
  .cover:hover img { transform:scale(1.04); }
  .cover .play { position:absolute; right:7px; bottom:7px; width:34px; height:34px; border-radius:50%; background:rgba(11,14,21,.78); border:1px solid rgba(255,255,255,.22); display:grid; place-items:center; }
  .cover .play::before { content:""; border-left:11px solid var(--ink); border-top:7px solid transparent; border-bottom:7px solid transparent; margin-left:3px; }
  .info { display:flex; flex-direction:column; min-width:0; padding:4px 2px 2px 0; }
  .k { display:flex; align-items:baseline; gap:8px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .k b { font-size:22px; font-weight:900; letter-spacing:-.02em; color:var(--red); }
  .k time { margin-left:auto; letter-spacing:.02em; text-transform:none; font-weight:600; color:var(--mute); white-space:nowrap; }
  .part h3 { font-size:18.5px; line-height:1.22; letter-spacing:-.01em; font-weight:700; margin-top:6px; text-wrap:balance; }
  .part h3 em { font-style:normal; color:var(--red); }
  .stats { display:flex; gap:12px; margin-top:6px; color:var(--dim); font-size:13px; font-weight:600; }
  .links { display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:12px; }
  .chip { display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 10px; border-radius:999px; border:1px solid var(--line2); background:var(--panel2); font-size:13px; font-weight:700; white-space:nowrap; transition:border-color .2s, background .2s; }
  .chip:hover { border-color:#55607a; background:#1f2738; }
  .chip svg { width:16px; height:16px; flex:none; }
  .chip.off { color:var(--mute); border-style:dashed; background:transparent; pointer-events:none; }
  .other { margin-top:10px; font-size:13px; color:var(--dim); font-weight:600; }
  .other a { color:var(--ink); border-bottom:1px solid var(--line2); padding-bottom:1px; }
  .other a:hover { border-color:var(--ink); }
  .seen { display:none; }                      /* phase 3: watch progress badge */
  .part.is-seen .seen { display:inline-flex; }

  /* not out yet in this language / locked for members: no media of ours in the page */
  .part.wait, .part.locked { grid-template-columns:100px 1fr; background:transparent; border-style:dashed; }
  .plate { width:100%; min-width:0; aspect-ratio:9/16; border-radius:10px; background:linear-gradient(180deg,var(--panel2),var(--panel)); display:grid; place-items:center; color:#343e55; font-weight:900; font-size:30px; letter-spacing:-.03em; }
  .plate svg { width:30px; height:30px; color:var(--dim); }
  .part.wait h3, .part.locked h3 { color:var(--dim); font-size:16.5px; }
  .part.locked { border-style:solid; border-color:var(--line2); background:var(--panel); }
  .part.locked .plate { background:radial-gradient(circle at 50% 42%, rgba(74,125,255,.2), transparent 62%), var(--panel2); }

  .ghosts { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:12px; }
  .ghosts span { height:32px; min-width:46px; padding:0 10px; display:grid; place-items:center; border-radius:9px; border:1px dashed var(--line2); color:var(--mute); font-size:13px; font-weight:800; }
  .ghosts em { font-style:normal; margin-left:6px; color:var(--mute); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; }
  .ep.later { padding-top:26px; }
  .ep.later .ep-head { margin-bottom:0; }
  .ep.later .ep-num { font-size:44px; }
  .ep.later h2 { font-size:20px; }

  /* ── follow + footer ── */
  .follow { margin-top:56px; padding:26px 20px; border-radius:22px; background:linear-gradient(140deg, rgba(74,125,255,.16), rgba(255,93,82,.10) 70%), var(--panel); border:1px solid var(--line); }
  .follow h2 { font-size:24px; letter-spacing:-.015em; line-height:1.15; }
  .follow p { color:var(--dim); margin-top:8px; max-width:34em; }
  .ch { display:grid; gap:10px; margin-top:18px; }
  .ch a { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; background:rgba(11,14,21,.55); border:1px solid var(--line); transition:border-color .2s; }
  .ch a:hover { border-color:#55607a; }
  .ch svg { width:22px; height:22px; flex:none; }
  .ch b { display:block; font-size:15px; }
  .ch small { display:block; color:var(--dim); font-size:13px; }
  .ch .tag { margin-left:auto; font-size:11px; font-weight:800; letter-spacing:.1em; padding:4px 8px; border-radius:6px; border:1px solid var(--line2); color:var(--dim); }
  footer { margin-top:36px; border-top:1px solid var(--line); padding:22px 0 40px; color:var(--mute); font-size:13.5px; display:flex; gap:8px 18px; flex-wrap:wrap; justify-content:space-between; }
  footer a:hover { color:var(--ink); }
  .err { margin:40px 0; padding:20px; border-radius:var(--r); border:1px solid var(--line); background:var(--panel); color:var(--dim); }

  /* ── player ── */
  .modal { position:fixed; inset:0; z-index:60; background:rgba(4,6,10,.94); display:none; align-items:center; justify-content:center; padding:14px; }
  .modal.open { display:flex; }
  .player { display:flex; flex-direction:column; gap:12px; align-items:center; max-height:100%; width:100%; }
  .frame { height:min(70vh,640px); aspect-ratio:9/16; max-width:100%; border-radius:16px; overflow:hidden; background:#000; }
  .frame iframe { width:100%; height:100%; border:0; display:block; }
  .side { width:min(100%,360px); text-align:center; }
  .side h3 { font-size:18px; line-height:1.25; margin:4px 0 12px; }
  .side .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .round { width:42px; height:42px; border-radius:50%; border:1px solid var(--line2); background:var(--panel); font-size:20px; cursor:pointer; display:grid; place-items:center; }
  .round:disabled { opacity:.3; cursor:default; }
  .x { position:absolute; top:12px; right:12px; z-index:2; }

  @media (min-width:560px) {
    .part, .part.wait, .part.locked { grid-template-columns:150px 1fr; }
    .ch { grid-template-columns:repeat(3,1fr); }
  }
  @media (min-width:900px) {
    .wrap { padding:0 28px; }
    :root { --bar:64px; }
    .brand { font-size:16px; }
    .hero { grid-template-columns:1.25fr .75fr; padding:72px 0 60px; gap:40px; }
    .lead { font-size:19px; }
    .switch { width:300px; }
    .cells { gap:8px; }
    .cell { height:46px; font-size:18px; }
  }
  @media (min-width:1100px) {
    .cell { grid-auto-flow:column; justify-content:flex-start; gap:7px; padding:0 9px; }
    .cell i { display:block; font-style:normal; font-size:12px; font-weight:700; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.85; }
  }
  @media (min-width:900px) {
    .ep { padding-top:64px; }
    .ep-num { font-size:96px; }
    .ep-head h2 { font-size:34px; }
    .ep.later .ep-num { font-size:56px; } .ep.later h2 { font-size:24px; }
    .parts { grid-template-columns:repeat(4,1fr); gap:16px; }
    .part, .part.wait, .part.locked { grid-template-columns:1fr; gap:0; padding:12px; }
    .info { padding:14px 4px 4px; }
    .part h3 { font-size:18px; }
    .part { min-width:0; }
    .follow { padding:40px; margin-top:88px; }
    .follow h2 { font-size:32px; }
    .player { flex-direction:row; gap:22px; justify-content:center; }
    .frame { height:min(86vh,760px); }
    .side { width:260px; text-align:left; }
    .side .row { justify-content:flex-start; }
    .side h3 { font-size:22px; }
  }
  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    .sw-gate, .sw-ring, .sw-flow, .sw-dot, .sw-bit::after { animation:none; }
    .sw-flow { opacity:1; }
    .cover img, .btn { transition:none; }
  }
</style>
</head>

<header class="bar"><div class="wrap">
  <a class="brand" href="#top"><img src="brand/icon_64.png" alt="" width="28" height="23"><span>CIRCUITARIUM</span></a>

<script>
/* Circuitarium site, phase 1.
   Content comes from data/episodes.json (the one file a publish step or a sync job rewrites).
   Extension points for later phases: window.CX (data, lang), the "cx:watch" / "cx:lang" events,
   .part[data-id], .part.is-seen, part.access === "members", per-language stats {views, likes}. */
const T = {
  en: {
    title:"Circuitarium — how chips work", eyebrow:"3D video course", h1:"How a chip works, <em>one switch at a time.</em>",
    lead:"From a single transistor, step by step, to a working calculator. Each part is under three minutes. Watch them in order.",
    start:"Start from 0.1", gate:"Gate", season:"Season", episode:"Episode", part:"Part",
    out:(a,b)=>`${a} of ${b} parts out`, parts:n=>`${n} parts`, soon:"Coming soon", count:(a,b)=>`${a} / ${b} parts`,
    waitTitle:"This part is coming soon in English", otherLead:"Already out in Russian:", otherAlso:"In Russian:",
    lockTitle:"Members only", lockBtn:"Register to watch", views:"views", likes:"likes",
    followH:"New part every day", followP:"The course comes out on YouTube and Instagram, one part at a time. Follow where you watch.",
    privacy:"Privacy", other:"ru", langName:{en:"English",ru:"Russian"}, watch:"Watch", close:"Close"
  },
  ru: {
    title:"Circuitarium — как работает чип", eyebrow:"3D-видеокурс", h1:"Как работает чип: <em>один выключатель за раз.</em>",
    lead:"От одного транзистора шаг за шагом до работающего калькулятора. Каждая часть короче трёх минут. Смотрите по порядку.",
    start:"Начать с 0.1", gate:"Затвор", season:"Сезон", episode:"Серия", part:"Часть",
    out:(a,b)=>`вышло ${a} из ${b}`, parts:n=>`${n} ${n%10>=2&&n%10<=4?"части":"частей"}`, soon:"Скоро", count:(a,b)=>`${a} / ${b} частей`,
    waitTitle:"Эта часть скоро выйдет на русском", otherLead:"Уже вышла на английском:", otherAlso:"На английском:",
    lockTitle:"Только для участников", lockBtn:"Зарегистрироваться", views:"просмотров", likes:"лайков",
    followH:"Новая часть каждый день", followP:"Курс выходит в Instagram и на YouTube, по одной части. Подпишитесь там, где удобнее смотреть.",
    privacy:"Конфиденциальность", other:"en", langName:{en:"английском",ru:"русском"}, watch:"Смотреть", close:"Закрыть"
  }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const accent = s => esc(s).replace(/\{([^}]*)\}/g, "<em>$1</em>");       // {word} = the red accent word, as on the covers
const plain = s => s.replace(/[{}]/g, "");
const icon = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const ext = 'target="_blank" rel="noopener"';

function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "ru" || q === "en") return q;
  try { const s = localStorage.getItem("cx-lang"); if (s === "ru" || s === "en") return s; } catch (e) {}
  return (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
}
const CX = window.CX = { data:null, lang:pickLang(), live:[] };

function linkChips(v, lang) {
  let h = "";
  if (v.youtube) h += `<a class="chip" href="https://youtube.com/shorts/${esc(v.youtube)}" ${ext}>${icon("i-yt")}YouTube</a>`;
  if (v.instagram) h += `<a class="chip" href="${esc(v.instagram)}" ${ext}>${icon("i-ig")}Instagram</a>`;
  return h;
}
function otherLine(p, lang, lead) {
  const o = T[lang].other, v = p[o]; if (!v) return "";
  const a = [];
  if (v.youtube) a.push(`<a href="https://youtube.com/shorts/${esc(v.youtube)}" ${ext} hreflang="${o}">YouTube</a>`);
  if (v.instagram) a.push(`<a href="${esc(v.instagram)}" ${ext} hreflang="${o}">Instagram</a>`);
  return a.length ? `<p class="other">${lead} ${a.join(" · ")}</p>` : "";
}

function render() {
  const d = CX.data, L = CX.lang, t = T[L];
  document.documentElement.lang = L; document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $("#season").textContent = `${t.season} ${d.season.n} · ${d.season.name[L]}`;

  const total = d.episodes.reduce((a, e) => a + e.parts, 0);
  CX.live = [];
  let cells = "", feed = "", outAll = 0;
  d.episodes.forEach(e => {
    const byK = {}; (e.published || []).forEach(p => byK[p.k] = p);
    const out = (e.published || []).filter(p => p[L]).length; outAll += out;
    const any = (e.published || []).length > 0;
    cells += `<a class="cell${out ? " has" : ""}" href="#ep${e.n}" data-ep="${e.n}" aria-label="${t.episode} ${e.n}: ${esc(e.name[L])}">${e.n}<i>${esc(e.name[L])}</i></a>`;
    const pips = Array.from({ length:e.parts }, (_, i) => `<i${byK[i + 1] && byK[i + 1][L] ? ' class="lit"' : ""}></i>`).join("");
    let body = "";
    if (any) {
      let cards = "", ghosts = "";
      for (let k = 1; k <= e.parts; k++) {
        const p = byK[k], label = `${e.n}.${k}`, kHead = `<span class="k"><b>${label}</b>${t.part} ${k}/${e.parts}`;
        if (p && p.access === "members") {
          cards += `<article class="part locked" data-id="${esc(p.id)}"><div class="plate">${icon("i-lock")}</div><div class="info">${kHead}</span><h3>${t.lockTitle}</h3><div class="links"><a class="chip" href="${esc(p.signup || "#")}">${icon("i-lock")}${t.lockBtn}</a></div></div></article>`;
        } else if (p && p[L]) {
          const v = p[L], title = plain(v.title), idx = CX.live.length;
          CX.live.push({ e, p, v });
          const date = v.date ? `<time datetime="${esc(v.date)}">${new Date(v.date + "T12:00:00").toLocaleDateString(L, { month:"short", day:"numeric" })}</time>` : "";
          const img = `<img src="${esc(v.cover)}" alt="${t.episode} ${label}: ${esc(title)}" width="540" height="960" loading="lazy" decoding="async">`;
          const cover = v.youtube
            ? `<button class="cover" type="button" data-open="${idx}" aria-label="${t.watch} ${label}: ${esc(title)}">${img}<span class="play"></span></button>`
            : `<a class="cover" href="${esc(v.instagram)}" ${ext} aria-label="${t.watch} ${label}: ${esc(title)}">${img}<span class="play"></span></a>`;
          const st = v.stats ? `<div class="stats">${v.stats.views != null ? `<span>${Number(v.stats.views).toLocaleString(L)} ${t.views}</span>` : ""}${v.stats.likes != null ? `<span>${Number(v.stats.likes).toLocaleString(L)} ${t.likes}</span>` : ""}</div>` : "";
          cards += `<article class="part" data-id="${esc(p.id)}">${cover}<div class="info">${kHead}${date}</span><h3>${accent(v.title)}</h3>${st}<div class="links">${linkChips(v, L)}</div>${otherLine(p, L, t.otherAlso)}</div></article>`;
        } else if (p) {
          cards += `<article class="part wait" data-id="${esc(p.id)}"><div class="plate">${label}</div><div class="info">${kHead}</span><h3>${t.waitTitle}</h3>${otherLine(p, L, t.otherLead)}</div></article>`;
        } else ghosts += `<span>${label}</span>`;
      }
      body = `<div class="parts">${cards}</div>${ghosts ? `<div class="ghosts">${ghosts}<em>${t.soon}</em></div>` : ""}`;
    }
    feed += `<section class="ep${any ? "" : " later"}" id="ep${e.n}"><div class="ep-head"><div class="ep-num">${e.n}</div><h2>${esc(e.name[L])}</h2>
      <div class="ep-sub"><span class="pips">${pips}</span><span>${any ? t.out(out, e.parts) : t.parts(e.parts) + " · " + t.soon}</span></div></div>${body}</section>`;
  });
  $("#cells").innerHTML = cells; $("#feed").innerHTML = feed; $("#count").textContent = t.count(outAll, total);

  const ch = d.channels, first = CX.live[0];
  $("#cta").innerHTML = (first ? (first.v.youtube
      ? `<button class="btn main" type="button" data-open="0">${icon("i-play")}${t.start}</button>`
      : `<a class="btn main" href="${esc(first.v.instagram)}" ${ext}>${icon("i-play")}${t.start}</a>`) : "")
    + (ch[L].youtube ? `<a class="btn" href="${esc(ch[L].youtube)}" ${ext}>${icon("i-yt")}YouTube</a>` : "")
    + `<a class="btn" href="${esc(ch[L].instagram)}" ${ext}>${icon("i-ig")}Instagram</a>`;
  const row = (href, ic, name, handle, tag) => `<a href="${esc(href)}" ${ext}>${icon(ic)}<span><b>${name}</b><small>${handle}</small></span><span class="tag">${tag}</span></a>`;
  const list = [["en", row(ch.en.youtube, "i-yt", "YouTube", "@Circuitarium", "EN")], ["en", row(ch.en.instagram, "i-ig", "Instagram", "@circuitarium", "EN")], ["ru", row(ch.ru.instagram, "i-ig", "Instagram", "@circuitarium_rus", "RU")]];
  $("#channels").innerHTML = list.sort((a, b) => (b[0] === L) - (a[0] === L)).map(x => x[1]).join("");
  watchMap();
}

/* light the cell of the episode in view */
let io;
function watchMap() {
  if (io) io.disconnect();
  const cells = [...document.querySelectorAll(".cell")];
  io = new IntersectionObserver(es => es.forEach(x => {
    if (x.isIntersecting) cells.forEach(c => c.classList.toggle("on", "ep" + c.dataset.ep === x.target.id));
  }), { rootMargin:"-30% 0px -60% 0px" });
  document.querySelectorAll(".ep").forEach(el => io.observe(el));
}

function setLang(L) {
  if (L === CX.lang) return;
  CX.lang = L;
  try { localStorage.setItem("cx-lang", L); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set("lang", L); history.replaceState(null, "", u);
  render();
  document.dispatchEvent(new CustomEvent("cx:lang", { detail:{ lang:L } }));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));

/* player (YouTube, privacy-enhanced host). Parts without a YouTube id open on Instagram instead. */
const modal = $("#modal"), yt = $("#yt");
let cur = -1, opener = null;
const playable = i => CX.live[i] && CX.live[i].v.youtube;
function step(i, dir) { for (i += dir; i >= 0 && i < CX.live.length; i += dir) if (playable(i)) return i; return -1; }
function openPlayer(i) {
  if (!playable(i)) return;
  cur = i; const { e, p, v } = CX.live[i], t = T[CX.lang];
  yt.src = `https://www.youtube-nocookie.com/embed/${v.youtube}?autoplay=1&rel=0&playsinline=1`;
  $("#m-where").textContent = `${t.episode} ${e.n} · ${e.name[CX.lang]} · ${t.part} ${p.k}/${e.parts}`;
  $("#m-title").textContent = plain(v.title);
  $("#m-links").innerHTML = linkChips(v, CX.lang);
  $("#prev").disabled = step(i, -1) < 0; $("#next").disabled = step(i, 1) < 0;
  modal.classList.add("open"); document.body.style.overflow = "hidden"; $("#close").focus();
  document.dispatchEvent(new CustomEvent("cx:watch", { detail:{ id:p.id, lang:CX.lang, source:"player" } }));
}
function closePlayer() { modal.classList.remove("open"); yt.src = "about:blank"; document.body.style.overflow = ""; if (opener) opener.focus(); }
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-open]");
  if (b) { opener = b; openPlayer(+b.dataset.open); }
});
$("#close").onclick = closePlayer;
modal.onclick = ev => { if (ev.target === modal) closePlayer(); };
$("#prev").onclick = () => { const i = step(cur, -1); if (i >= 0) openPlayer(i); };
$("#next").onclick = () => { const i = step(cur, 1); if (i >= 0) openPlayer(i); };
document.addEventListener("keydown", ev => {
  if (!modal.classList.contains("open")) return;
  if (ev.key === "Escape") closePlayer();
  if (ev.key === "ArrowRight") $("#next").click();
  if (ev.key === "ArrowLeft") $("#prev").click();
});

fetch("data/episodes.json", { cache:"no-cache" }).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => { CX.data = d; render(); })
  .catch(() => { $("#feed").innerHTML = `<p class="err">Could not load the episode list. Watch on <a href="https://www.youtube.com/@Circuitarium"><u>YouTube</u></a> or <a href="https://www.instagram.com/circuitarium/"><u>Instagram</u></a>.</p>`; });
</script>
</body>
</html>
